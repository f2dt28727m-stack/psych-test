<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Quizy</title>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
.header{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #222;z-index:100}
.back-btn{font-size:20px;cursor:pointer;color:#fff}
.logo{margin-left:15px;font-size:20px;font-weight:800;background:linear-gradient(90deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.main{padding:80px 20px 40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.quiz-icon{width:120px;height:120px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:30px;border:1px solid #333}
.quiz-title{font-size:24px;font-weight:700;margin-bottom:12px;line-height:1.3;padding:0 20px}
.quiz-meta{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:30px;color:#666;font-size:14px}
.stats{display:flex;gap:30px;margin-bottom:40px}
.stat-item{text-align:center}
.stat-num{font-size:20px;font-weight:700;color:#00d4ff}
.stat-label{font-size:12px;color:#666;margin-top:4px}
.actions{display:flex;flex-direction:column;gap:15px;width:100%;max-width:300px}
.start-btn{width:100%;padding:18px;background:linear-gradient(90deg,#00d4ff,#00ff88);border:none;border-radius:30px;font-size:18px;font-weight:700;color:#000;cursor:pointer}
.vote-btns{display:flex;justify-content:center;gap:40px}
.vote-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:#666;font-size:14px}
.vote-btn .icon{width:50px;height:50px;background:#1a1a1a;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.description{max-width:400px;margin-top:40px;padding:20px;background:#141414;border-radius:16px;color:#888;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="header"><div class="back-btn" onclick="goHome()">←</div><div class="logo" onclick="goHome()">Quizy</div></div>
<div class="main" id="app"></div>
<script>
const params=new URLSearchParams(window.location.search);
const quizId=params.get('id')||'perfect-match';

const quizzes={
'harry-potter-soulmate':{t:'Which Harry Potter Character Is Your Soulmate?',i:'⚡',c:'MBTI',v:1200000,l:8500,ts:980000,sh:12000,d:'Find your perfect match based on MBTI personality type!'},
'marvel-cp':{t:'Who Is Your Perfect Marvel CP?',i:'🕷️',c:'MBTI',v:980000,l:7200,ts:820000,sh:9800,d:'Find your perfect Marvel superhero match!'},
'workplace-partner':{t:'Find Your Perfect Workplace Partner',i:'💼',c:'MBTI',v:850000,l:6500,ts:750000,sh:8500,d:'Discover your ideal work buddy!'},
'pop-culture-friend':{t:'Who Is Your Ideal Best Friend in Pop Culture?',i:'🎬',c:'MBTI',v:750000,l:5500,ts:650000,sh:7500,d:'Find your BFF from pop culture!'},
'disney-princess':{t:'Which Disney Princess Is Your Kindred Spirit?',i:'🏰',c:'MBTI',v:900000,l:7800,ts:820000,sh:9000,d:'Which Disney princess matches your soul?'},
'kdrama-partner':{t:'Find Your Ideal K-Drama Partner',i:'📺',c:'MBTI',v:680000,l:5200,ts:580000,sh:6800,d:'Your perfect K-Drama match awaits!'},
'video-game-team':{t:'Which Video Game Character Are You Meant To Team Up With?',i:'🎮',c:'MBTI',v:720000,l:5800,ts:620000,sh:7200,d:'Find your gaming partner!'},
'travel-buddy':{t:"What's Your Ideal Travel Buddy Personality?",i:'✈️',c:'MBTI',v:650000,l:4800,ts:550000,sh:6500,d:'Find your perfect travel companion!'},
'anime-compat':{t:'Which Anime Character Are You Most Compatible With?',i:'🎌',c:'MBTI',v:820000,l:6800,ts:720000,sh:8200,d:'Your anime soulmate is waiting!'},
'study-buddy':{t:'Find Your Perfect Study Buddy Personality',i:'📚',c:'MBTI',v:580000,l:4200,ts:480000,sh:5800,d:'Find your perfect study partner!'},
'perfect-match':{t:'Who is your perfect match in life?',i:'💕',c:'Soulmate',v:1200000,l:8500,ts:980000,sh:12000,d:'Find out who is your perfect match! Answer 12 questions to discover your ideal partner.'},
'real-soulmate':{t:'Who is your real soulmate?',i:'💘',c:'Soulmate',v:980000,l:7200,ts:820000,sh:9800,d:'Discover your true soulmate! Answer these questions to find who truly matches your energy.'},
'movie-character':{t:'Which movie character are you?',i:'🎬',c:'Which X',v:920000,l:7800,ts:780000,sh:9200,d:'Which iconic movie character matches your personality? Take the quiz to find out!'}
};

const q=quizzes[quizId]||quizzes['perfect-match'];

function goHome(){window.location.href='index.html';}
function startQuiz(){window.location.href='quiz.html?id='+quizId;}

let liked=false,disliked=false;
function vote(type){
if(type==='like'){
if(liked){document.getElementById('like-btn').classList.remove('liked');liked=false;}
else{document.getElementById('like-btn').classList.add('liked');liked=true;if(disliked){document.getElementById('dislike-btn').classList.remove('disliked');disliked=false;}}
}else{
if(disliked){document.getElementById('dislike-btn').classList.remove('disliked');disliked=false;}
else{document.getElementById('dislike-btn').classList.add('disliked');disliked=true;if(liked){document.getElementById('like-btn').classList.remove('liked');liked=false;}}
}
}

document.getElementById('app').innerHTML=`
<div class="quiz-icon">${q.i}</div>
<div class="quiz-title">${q.t}</div>
<div class="quiz-meta"><span>📊 ${q.c}</span><span>👀 ${(q.v/10000).toFixed(1)}W views</span></div>
<div class="stats"><div class="stat-item"><div class="stat-num">${(q.l/1000).toFixed(1)}K</div><div class="stat-label">Likes</div></div><div class="stat-item"><div class="stat-num">${(q.ts/10000).toFixed(1)}W</div><div class="stat-label">Tests</div></div><div class="stat-item"><div class="stat-num">${(q.sh/1000).toFixed(1)}K</div><div class="stat-label">Shares</div></div></div>
<div class="actions"><button class="start-btn" onclick="startQuiz()">Start Now ▶</button><div class="vote-btns"><button class="vote-btn" id="like-btn" onclick="vote('like')"><div class="icon">👍</div><span>${q.l}</span></button><button class="vote-btn" id="dislike-btn" onclick="vote('dislike')"><div class="icon">👎</div><span>${Math.floor(q.l*0.1)}</span></button></div></div>
<div class="description">${q.d}</div>
`;
</script>
</body>
</html>
