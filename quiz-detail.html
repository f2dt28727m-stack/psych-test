<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Quizy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #222;
            z-index: 100;
        }
        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: #fff;
        }
        .logo {
            margin-left: 15px;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Main */
        .main {
            padding-top: 80px;
            padding-bottom: 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 30px 40px;
        }
        
        /* Quiz Cover */
        .quiz-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        
        .quiz-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        
        .quiz-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            color: #666;
            font-size: 14px;
        }
        
        .quiz-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Stats */
        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-num {
            font-size: 20px;
            font-weight: 700;
            color: #00d4ff;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        /* Action buttons */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        
        .start-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.02);
        }
        
        /* Like/Dislike */
        .vote-btns {
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        
        .vote-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 14px;
        }
        .vote-btn:active {
            transform: scale(0.95);
        }
        .vote-btn .icon {
            width: 50px;
            height: 50px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .vote-btn.liked .icon {
            border-color: #ff4757;
            color: #ff4757;
        }
        .vote-btn.disliked .icon {
            border-color: #7bed9f;
            color: #7bed9f;
        }
        
        /* Description */
        .description {
            max-width: 400px;
            margin-top: 40px;
            padding: 20px;
            background: #141414;
            border-radius: 16px;
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="back-btn" onclick="goBack()">←</div>
        <div class="logo" onclick="goHome()">Quizy</div>
    </div>
    
    <!-- Main -->
    <div class="main" id="app">
        <div class="quiz-icon" id="quiz-icon">💕</div>
        <div class="quiz-title" id="quiz-title">Loading...</div>
        
        <div class="quiz-meta">

        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-num" id="stat-likes">0</div>
                <div class="stat-label">Likes</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="stat-tests">0</div>
                <div class="stat-label">Tests Taken</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="stat-shares">0</div>
                <div class="stat-label">Shares</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="start-btn" onclick="startQuiz()">Start Now ▶</button>
            
            <div class="vote-btns">
                <button class="vote-btn" id="like-btn" onclick="vote('like')">
                    <div class="icon">👍</div>
                    <span id="like-count">0</span>
                </button>
                <button class="vote-btn" id="dislike-btn" onclick="vote('dislike')">
                    <div class="icon">👎</div>
                    <span id="dislike-count">0</span>
                </button>
            </div>
        </div>
        
        <div class="description" id="quiz-desc">
            Take this quiz to discover your result! Answer 12 questions to find out which character matches your personality.
        </div>
    </div>

            'real-destiny': { title: "What's your real destiny?", icon: '📜', category: 'Future', views: 320000, likes: 2700, tests: 260000, shares: 2900, desc: 'What is your real destiny?' },
            'future-hold': { title: 'What does your future hold?', icon: '🎁', category: 'Future', views: 280000, likes: 2300, tests: 220000, shares: 2500, desc: 'What does the future hold for you?' },

        const quiz = quizzes[quizId] || quizzes['perfect-match'];
        
        // Render
        document.getElementById('quiz-icon').textContent = quiz.icon;
        document.getElementById('quiz-title').textContent = quiz.title;
        document.getElementById('quiz-category').textContent = quiz.category;
        document.getElementById('quiz-views').textContent = (quiz.views / 10000).toFixed(1) + 'W';
        document.getElementById('stat-likes').textContent = (quiz.likes / 1000).toFixed(1) + 'K';
        document.getElementById('stat-tests').textContent = (quiz.tests / 10000).toFixed(1) + 'W';
        document.getElementById('stat-shares').textContent = (quiz.shares / 1000).toFixed(1) + 'K';
        document.getElementById('like-count').textContent = quiz.likes;
        document.getElementById('dislike-count').textContent = Math.floor(quiz.likes * 0.1);
        document.getElementById('quiz-desc').textContent = quiz.desc;
        document.title = quiz.title + ' - Quizy';
        
        function goBack() {
            window.location.href = 'index.html';
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        function startQuiz() {
            window.location.href = 'quiz.html?id=' + quizId;
        }
        
        let liked = false;
        let disliked = false;
        
        function vote(type) {
            if (type === 'like') {
                if (liked) {
                    document.getElementById('like-btn').classList.remove('liked');
                    document.getElementById('like-count').textContent = parseInt(document.getElementById('like-count').textContent) - 1;
                    liked = false;
                } else {
                    if (disliked) {
                        document.getElementById('dislike-btn').classList.remove('disliked');
                        document.getElementById('dislike-count').textContent = parseInt(document.getElementById('dislike-count').textContent) - 1;
                        disliked = false;
                    }
                    document.getElementById('like-btn').classList.add('liked');
                    document.getElementById('like-count').textContent = parseInt(document.getElementById('like-count').textContent) + 1;
                    liked = true;
                }
            } else {
                if (disliked) {
                    document.getElementById('dislike-btn').classList.remove('disliked');
                    document.getElementById('dislike-count').textContent = parseInt(document.getElementById('dislike-count').textContent) - 1;
                    disliked = false;
                } else {
                    if (liked) {

                    }

                }
