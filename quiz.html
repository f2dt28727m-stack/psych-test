<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Personality Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 600px; width: 100%; }
        
        /* Progress bar */
        .progress-wrap { margin-bottom: 30px; width: 100%; }
        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.4s ease;
            border-radius: 3px;
        }
        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: #888;
            font-size: 14px;
        }
        
        /* Question card */
        .question-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 24px;
            border: 1px solid #333;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .question-number {
            color: #00d4ff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        
        /* Options */
        .option-list { display: flex; flex-direction: column; gap: 12px; }
        
        .option {
            background: #252525;
            border: 2px solid #333;
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }
        .option:hover {
            border-color: #00d4ff;
            background: #2a2a2a;
        }
        .option.selected {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.1);
        }
        
        /* Result */
        .result-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .result-title {
            font-size: 16px;
            color: #888;
            margin-bottom: 12px;
        }
        
        .result-name {
            font-size: 32px;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 16px;
        }
        
        .result-desc {
            font-size: 16px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        .match-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 12px 16px;
            border-radius: 12px;
        }
        
        .match-bar {
            flex: 1;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .match-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 4px;
        }
        
        .match-name {
            width: 80px;
            text-align: left;
            font-weight: 500;
        }
        
        .match-percent {
            width: 40px;
            text-align: right;
            color: #00d4ff;
            font-weight: 600;
        }
        
        /* Share buttons */
        .share-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .share-btn {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .share-btn.primary {
            background: #00d4ff;
            color: #000;
        }
        .share-btn.primary:hover { background: #00b8e6; }
        
        .share-btn.secondary {
            background: #333;
            color: #fff;
        }
        .share-btn.secondary:hover { background: #444; }
        
        /* Back button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Random button */
        .random-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            border: none;
            border-radius: 14px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goHome()">←</button>
    
    <div class="container" id="app">
        <!-- Quiz content -->
    </div>

    <script>
        // Get quiz ID from URL
        const params = new URLSearchParams(window.location.search);
        const quizId = params.get('id') || 'perfect-match';
        
        // Quiz data
        const quizData = {
            id: quizId,
            title: getQuizTitle(quizId)
        };
        
        const questions = [
            {
                id: 'q1',
                text: 'When someone hurts you, what do you do?',
                options: [
                    { text: 'Confront them directly', score: 'A' },
                    { text: 'Write them a letter', score: 'B' },
                    { text: 'Pretend it didn\'t happen', score: 'C' },
                    { text: 'Talk to a friend about it', score: 'D' }
                ]
            },
            {
                id: 'q2',
                text: 'How do you spend your ideal Friday night?',
                options: [
                    { text: 'Go to a party', score: 'A' },
                    { text: 'Stay home reading', score: 'B' },
                    { text: 'Go on a date', score: 'C' },
                    { text: 'Hang out with close friends', score: 'D' }
                ]
            },
            {
                id: 'q3',
                text: 'When you love someone, what do you do?',
                options: [
                    { text: 'Show it through actions', score: 'A' },
                    { text: 'Tell them every day', score: 'C' },
                    { text: 'Write them poems', score: 'B' },
                    { text: 'Plan future together', score: 'D' }
                ]
            },
            {
                id: 'q4',
                text: 'Your date is late for 30 minutes, you...',
                options: [
                    { text: 'Leave immediately', score: 'A' },
                    { text: 'Wait and get angry', score: 'B' },
                    { text: 'Text them calmly', score: 'C' },
                    { text: 'Pretend you\'re also late', score: 'D' }
                ]
            },
            {
                id: 'q5',
                text: 'What\'s your move when you first meet someone you like?',
                options: [
                    { text: 'Walk up and introduce yourself', score: 'A' },
                    { text: 'Make eye contact and smile', score: 'C' },
                    { text: 'Wait for them to approach you', score: 'B' },
                    { text: 'Find mutual friends to introduce', score: 'D' }
                ]
            },
            {
                id: 'q6',
                text: 'When you argue with your partner, you...',
                options: [
                    { text: 'Yell and get it out', score: 'A' },
                    { text: 'Stay silent and cold', score: 'B' },
                    { text: 'Walk away and think', score: 'C' },
                    { text: 'Try to compromise', score: 'D' }
                ]
            },
            {
                id: 'q7',
                text: 'What do you look for in a partner first?',
                options: [
                    { text: 'Ambition', score: 'A' },
                    { text: 'Intelligence', score: 'B' },
                    { text: 'Kindness', score: 'C' },
                    { text: 'Good looks', score: 'D' }
                ]
            },
            {
                id: 'q8',
                text: 'How do you handle a breakup?',
                options: [
                    { text: 'Delete everything and move on', score: 'A' },
                    { text: 'Cry and mourn', score: 'C' },
                    { text: 'Stay friends', score: 'D' },
                    { text: 'Find someone new immediately', score: 'B' }
                ]
            },
            {
                id: 'q9',
                text: 'When your partner needs space, you...',
                options: [
                    { text: 'Ask why immediately', score: 'A' },
                    { text: 'Give them full space', score: 'B' },
                    { text: 'Get anxious and insecure', score: 'C' },
                    { text: 'Use the time for yourself too', score: 'D' }
                ]
            },
            {
                id: 'q10',
                text: 'What\'s your idea of a perfect date?',
                options: [
                    { text: 'Adventure and excitement', score: 'A' },
                    { text: 'Quiet dinner for two', score: 'B' },
                    { text: 'Movie and popcorn at home', score: 'C' },
                    { text: 'Fun activities with friends', score: 'D' }
                ]
            },
            {
                id: 'q11',
                text: 'When you suspect your partner is lying, you...',
                options: [
                    { text: 'Confront them right away', score: 'A' },
                    { text: 'Investigate secretly', score: 'B' },
                    { text: 'Pretend not to notice', score: 'C' },
                    { text: 'Trust but verify', score: 'D' }
                ]
            },
            {
                id: 'q12',
                text: 'How do you show love to your family?',
                options: [
                    { text: 'Help them with problems', score: 'A' },
                    { text: 'Say I love you often', score: 'B' },
                    { text: 'Buy them gifts', score: 'D' },
                    { text: 'Spend time with them', score: 'C' }
                ]
            }
        ];
        
        // Results
        const results = {
            'A': { name: 'Romeo', desc: 'You are the passionate romantic type. You love deeply and intensely, never holding back your feelings.' },
            'B': { name: 'Mr. Darcy', desc: 'You are the proud but lovable type. Your love is subtle but deep, showing care through actions.' },
            'C': { name: 'Jack', desc: 'You are the adventurous soulmate. You seek excitement and passion in relationships.' },
            'D': { name: 'Noah', desc: 'You are the devoted partner. Steady, loyal, and always there for your loved one.' }
        };
        
        let currentQuestion = 0;
        let answers = {};
        
        function getQuizTitle(id) {
            const titles = {
                'perfect-match': 'Who is your perfect match in life?',
                'real-soulmate': 'Who is your real soulmate?',
                'ideal-boyfriend': 'Who would be your ideal boyfriend?',
                'movie-character': 'Which movie character are you?'
            };
            return titles[id] || 'Quiz';        }
        
        function renderQuestion() {
            const q = questions[currentQuestion];
            const app = document.getElementById('app');
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            
            app.innerHTML = `
                <div class="progress-wrap">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="progress-text">${currentQuestion + 1} / ${questions.length}</div>
                </div>
                
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1}</div>
                    <div class="question-text">${q.text}</div>
                    <div class="option-list">
                        ${q.options.map((opt, i) => `
                            <div class="option" onclick="selectOption('${opt.score}')">${opt.text}</div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function selectOption(score) {
            answers[questions[currentQuestion].id] = score;
            
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResult();
            }
        }
        
        function showResult() {
            // Calculate scores
            const scoreCount = {};
            Object.values(answers).forEach(s => {
                scoreCount[s] = (scoreCount[s] || 0) + 1;
            });
            
            // Get top score
            let topScore = 'A';
            let maxCount = 0;
            Object.entries(scoreCount).forEach(([k, v]) => {
                if (v > maxCount) {
                    maxCount = v;
                    topScore = k;
                }
            });
            
            // Generate match percentages
            const p1 = 50 + Math.floor(Math.random() * 30);
            const p2 = 20 + Math.floor(Math.random() * 20);
            const p3 = 10 + Math.floor(Math.random() * 15);
            const p4 = 100 - p1 - p2 - p3;
            const matches = [
                { name: results[topScore].name, percent: p1 },
                { name: results['B'].name, percent: p2 },
                { name: results['C'].name, percent: p3 },
                { name: results['D'].name, percent: p4 }
            ].sort((a, b) => b.percent - a.percent);
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="result-card">
                    <div class="result-title">Your perfect match is</div>
                    <div class="result-name">${matches[0].name}</div>
                    <div class="result-desc">${results[topScore].desc}</div>
                    
                    <div class="match-list">
                        ${matches.map(m => `
                            <div class="match-item">
                                <div class="match-name">${m.name}</div>
                                <div class="match-bar">
                                    <div class="match-fill" style="width: ${m.percent}%"></div>
                                </div>
                                <div class="match-percent">${m.percent}%</div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="share-btns">
                        <button class="share-btn primary" onclick="shareResult()">📤 Share Result</button>
                        <button class="share-btn secondary" onclick="goHome()">🔄 Try Another</button>
                    </div>
                </div>
                
                <button class="random-btn" onclick="goHome()">🎲 Random Quiz</button>
            `;
        }
        
        function shareResult() {
            const text = `I got "${document.querySelector('.result-name').textContent}"! Take the quiz: ${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({ title: 'My Quiz Result', text: text });
            } else {
                navigator.clipboard.writeText(text);
                alert('Link copied to clipboard!');
            }
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Start
        renderQuestion();
    </script>
</body>
</html>
