<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理测试题库 - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #8892b0;
            font-size: 1.1rem;
        }
        .category {
            margin-bottom: 40px;
        }
        .category-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .theme-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .theme-card:hover {
            transform: translateY(-4px);
            border-color: #00d4ff;
            box-shadow: 0 10px 40px rgba(0,212,255,0.2);
        }
        .theme-card.hot {
            border-color: #ff6b6b;
        }
        .theme-card.hot::before {
            content: '🔥';
            position: absolute;
            top: 12px;
            right: 12px;
        }
        .theme-card {
            position: relative;
        }
        .theme-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .theme-desc {
            color: #8892b0;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .theme-meta {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            color: #5a6a8a;
        }
        .tag {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .tag.mbti {
            background: rgba(124,58,237,0.2);
            color: #a78bfa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 心理测试题库</h1>
            <p class="subtitle">探索你的性格密码</p>
        </header>
        
        <div id="app"></div>
    </div>

    <script>
        // Quiz data
        const data = {
            categories: [
                { id: 'match', name: '💕 Match / Soulmate', icon: '💕' },
                { id: 'which', name: '🎭 Which X Are You', icon: '🎭' },
                { id: 'type', name: '📝 What\'s Your Type', icon: '📝' },
                { id: 'how', name: '📊 How Adjective Are You', icon: '📊' },
                { id: 'hidden', name: '🔮 Hidden / Secret', icon: '🔮' },
                { id: 'whatwould', name: '❓ What Would You Do', icon: '❓' },
                { id: 'pick', name: '✌️ Pick One / Choose', icon: '✌️' },
                { id: 'future', name: '🔮 Future / Destiny', icon: '🔮' }
            ],
            themes: [
                { id: 'perfect-match', category_id: 'match', title: 'Who is your perfect match in life?', is_hot: true, hot_rank: 1 },
                { id: 'real-soulmate', category_id: 'match', title: 'Who is your real soulmate?', is_hot: true, hot_rank: 2 },
                { id: 'ideal-boyfriend', category_id: 'match', title: 'Who would be your ideal boyfriend?', is_hot: true, hot_rank: 3 },
                { id: 'perfect-girlfriend', category_id: 'match', title: 'Who would be your perfect girlfriend?', is_hot: true, hot_rank: 4 },
                { id: 'true-love-match', category_id: 'match', title: 'Which character is your true love match?', is_hot: true, hot_rank: 5 },
                { id: 'destiny-partner', category_id: 'match', title: 'Who is your destiny partner?', is_hot: true, hot_rank: 6 },
                { id: 'movie-character', category_id: 'which', title: 'Which movie character are you?', is_hot: true, hot_rank: 7 },
                { id: 'mythical-creature', category_id: 'which', title: 'Which mythical creature are you?', is_hot: false },
                { id: 'kind-of-friend', category_id: 'which', title: 'Which kind of friend are you?', is_hot: false },
                { id: 'aesthetic-style', category_id: 'which', title: 'Which aesthetic style are you?', is_hot: false },
                { id: 'energy-archetype', category_id: 'which', title: 'Which energy archetype are you?', is_hot: false },
                { id: 'song-describes', category_id: 'which', title: 'Which song describes you?', is_hot: false },
                { id: 'color-personality', category_id: 'which', title: 'Which color personality are you?', is_hot: false },
                { id: 'real-love-type', category_id: 'type', title: 'What\'s your real love type?', is_hot: false },
                { id: 'true-aesthetic-type', category_id: 'type', title: 'What\'s your true aesthetic type?', is_hot: false },
                { id: 'inner-energy-type', category_id: 'type', title: 'What\'s your inner energy type?', is_hot: false },
                { id: 'friendship-type', category_id: 'type', title: 'What\'s your friendship type?', is_hot: false },
                { id: 'dating-type', category_id: 'type', title: 'What\'s your dating type?', is_hot: false },
                { id: 'vibe-type', category_id: 'type', title: 'What\'s your vibe type?', is_hot: false },
                { id: 'loyal-really', category_id: 'how', title: 'How loyal are you really?', is_hot: false },
                { id: 'romantic-deep', category_id: 'how', title: 'How romantic are you deep down?', is_hot: false },
                { id: 'brave-in-love', category_id: 'how', title: 'How brave are you in love?', is_hot: false },
                { id: 'toxic-personality', category_id: 'how', title: 'How toxic is your personality?', is_hot: false },
                { id: 'kind-heart', category_id: 'how', title: 'How kind is your heart?', is_hot: false },
                { id: 'confident-actually', category_id: 'how', title: 'How confident are you actually?', is_hot: false },
                { id: 'sensitive', category_id: 'how', title: 'How sensitive are you?', is_hot: false },
                { id: 'hidden-superpower', category_id: 'hidden', title: 'What\'s your hidden superpower?', is_hot: false },
                { id: 'secret-trauma', category_id: 'hidden', title: 'What\'s your secret inner trauma?', is_hot: false },
                { id: 'hidden-talent', category_id: 'hidden', title: 'What\'s your hidden natural talent?', is_hot: false },
                { id: 'dark-side', category_id: 'hidden', title: 'What\'s your dark side personality?', is_hot: false },
                { id: 'secret-desire', category_id: 'hidden', title: 'What\'s your secret desire?', is_hot: false },
                { id: 'hidden-fear', category_id: 'hidden', title: 'What\'s your hidden fear?', is_hot: false },
                { id: 'secret-strength', category_id: 'hidden', title: 'What\'s your secret strength?', is_hot: false },
                { id: 'love-crisis', category_id: 'whatwould', title: 'What would you do in a love crisis?', is_hot: false },
                { id: 'win-lottery', category_id: 'whatwould', title: 'What would you do if you won the lottery?', is_hot: false },
                { id: 'dangerous-situation', category_id: 'whatwould', title: 'What would you do in a dangerous situation?', is_hot: false },
                { id: 'for-dream', category_id: 'whatwould', title: 'What would you do for your dream?', is_hot: false },
                { id: 'meet-idol', category_id: 'whatwould', title: 'What would you do if you met your idol?', is_hot: false },
                { id: 'breakup', category_id: 'whatwould', title: 'What would you do in a breakup?', is_hot: false },
                { id: 'pick-personality', category_id: 'pick', title: 'Pick one, we\'ll guess your personality.', is_hot: false },
                { id: 'choose-type', category_id: 'pick', title: 'Choose one, we\'ll reveal your real type.', is_hot: false },
                { id: 'pick-soulmate', category_id: 'pick', title: 'Pick your favorite, find your soulmate.', is_hot: false },
                { id: 'choose-dark-side', category_id: 'pick', title: 'Choose one, discover your dark side.', is_hot: false },
                { id: 'pick-picture', category_id: 'pick', title: 'Pick a picture, know your future.', is_hot: false },
                { id: 'choose-true-self', category_id: 'pick', title: 'Choose an option, see your true self.', is_hot: false },
                { id: 'future-love', category_id: 'future', title: 'What\'s your future love life like?', is_hot: false },
                { id: 'who-marry', category_id: 'future', title: 'Who will you end up marrying?', is_hot: false },
                { id: 'real-destiny', category_id: 'future', title: 'What\'s your real destiny?', is_hot: false },
                { id: 'future-hold', category_id: 'future', title: 'What does your future hold for you?', is_hot: false },
                { id: 'meet-soulmate', category_id: 'future', title: 'When will you meet your soulmate?', is_hot: false }
            ]
        };

        function render() {
            const app = document.getElementById('app');
            let html = '';

            data.categories.forEach(cat => {
                const catThemes = data.themes.filter(t => t.category_id === cat.id);
                if (catThemes.length === 0) return;

                html += `
                    <div class="category">
                        <h2 class="category-title">${cat.icon} ${cat.name}</h2>
                        <div class="theme-grid">
                            ${catThemes.map(theme => `
                                <div class="theme-card ${theme.is_hot ? 'hot' : ''}" onclick="goToTest('${theme.id}')">
                                    <div class="theme-title">${theme.title}</div>
                                    <div class="theme-desc">${theme.description}</div>
                                    <div class="theme-meta">
                                        ${theme.tag ? `<span class="tag ${theme.tag}">MBTI</span>` : ''}
                                        ${theme.is_hot ? '<span class="tag">🔥热门</span>' : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            app.innerHTML = html;
        }

        function goToTest(themeId) {
            window.location.href = `quiz.html?theme=${themeId}`;
        }

        render();
    </script>
</body>
</html>
