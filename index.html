<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Hub - Personality Tests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Search */
        .search-section { padding: 30px 0; text-align: center; }
        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 16px 24px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            background: #1a1a1a;
            color: #fff;
            outline: none;
        }
        .search-box::placeholder { color: #666; }
        
        /* Section titles */
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section { margin-bottom: 50px; }
        
        /* Hot tests - horizontal scroll */
        .hot-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: #333 #111;
        }
        .hot-scroll::-webkit-scrollbar { height: 6px; }
        .hot-scroll::-webkit-scrollbar-track { background: #111; }
        .hot-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        
        .hot-card {
            min-width: 200px;
            height: 280px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .hot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.3);
        }
        .hot-card::before {
            content: '🔥';
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 24px;
        }
        .hot-card .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .hot-card .count {
            font-size: 14px;
            color: #888;
        }
        
        /* Grid - 4 columns */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .grid-4 { grid-template-columns: 1fr; } }
        
        .grid-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #333;
        }
        .grid-card:hover {
            border-color: #00d4ff;
            transform: translateY(-3px);
        }
        .grid-card .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .grid-card .desc {
            font-size: 14px;
            color: #888;
        }
        
        /* All list */
        .all-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .all-item {
            background: #1a1a1a;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #222;
        }
        .all-item:hover {
            background: #222;
            border-color: #444;
        }
        .all-item .title { font-weight: 500; }
        .all-item .arrow { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Search -->
        <div class="search-section">
            <input type="text" class="search-box" placeholder="🔍 Search quizzes..." id="searchInput">
        </div>
        
        <!-- Hot / Latest -->
        <div class="section">
            <div class="section-title">🔥 Latest Hot</div>
            <div class="hot-scroll" id="hotSection"></div>
        </div>
        
        <!-- Classic -->
        <div class="section">
            <div class="section-title">⭐ Most Classic</div>
            <div class="grid-4" id="classicSection"></div>
        </div>
        
        <!-- Personalized -->
        <div class="section">
            <div class="section-title">💡 Best For You</div>
            <div class="grid-4" id="personalSection"></div>
        </div>
        
        <!-- All -->
        <div class="section">
            <div class="section-title">📚 All Tests</div>
            <div class="all-list" id="allSection"></div>
        </div>
    </div>

    <script>
        // Data - will be loaded from JSON
        const categories = [
            {id: 'match', name: '💕 Match / Soulmate'},
            {id: 'which', name: '🎭 Which X Are You'},
            {id: 'type', name: '📝 What\'s Your Type'},
            {id: 'how', name: '📊 How Adjective'},
            {id: 'hidden', name: '🔮 Hidden / Secret'},
            {id: 'whatwould', name: '❓ What Would You Do'},
            {id: 'pick', name: '✌️ Pick One'},
            {id: 'future', name: '🔮 Future / Destiny'}
        ];
        
        const themes = [
            {id: 'perfect-match', title: 'Who is your perfect match in life?', is_hot: true, category: 'match'},
            {id: 'real-soulmate', title: 'Who is your real soulmate?', is_hot: true, category: 'match'},
            {id: 'ideal-boyfriend', title: 'Who would be your ideal boyfriend?', is_hot: true, category: 'match'},
            {id: 'perfect-girlfriend', title: 'Who would be your perfect girlfriend?', is_hot: true, category: 'match'},
            {id: 'true-love-match', title: 'Which character is your true love match?', is_hot: true, category: 'match'},
            {id: 'destiny-partner', title: 'Who is your destiny partner?', is_hot: true, category: 'match'},
            {id: 'movie-character', title: 'Which movie character are you?', is_hot: true, category: 'which'},
            {id: 'mythical-creature', title: 'Which mythical creature are you?', category: 'which'},
            {id: 'kind-of-friend', title: 'Which kind of friend are you?', category: 'which'},
            {id: 'aesthetic-style', title: 'Which aesthetic style are you?', category: 'which'},
            {id: 'energy-archetype', title: 'Which energy archetype are you?', category: 'which'},
            {id: 'song-describes', title: 'Which song describes you?', category: 'which'},
            {id: 'color-personality', title: 'Which color personality are you?', category: 'which'},
            {id: 'real-love-type', title: 'What\'s your real love type?', category: 'type'},
            {id: 'true-aesthetic-type', title: 'What\'s your true aesthetic type?', category: 'type'},
            {id: 'inner-energy-type', title: 'What\'s your inner energy type?', category: 'type'},
            {id: 'friendship-type', title: 'What\'s your friendship type?', category: 'type'},
            {id: 'dating-type', title: 'What\'s your dating type?', category: 'type'},
            {id: 'vibe-type', title: 'What\'s your vibe type?', category: 'type'},
            {id: 'loyal-really', title: 'How loyal are you really?', category: 'how'},
            {id: 'romantic-deep', title: 'How romantic are you deep down?', category: 'how'},
            {id: 'brave-in-love', title: 'How brave are you in love?', category: 'how'},
            {id: 'toxic-personality', title: 'How toxic is your personality?', category: 'how'},
            {id: 'kind-heart', title: 'How kind is your heart?', category: 'how'},
            {id: 'confident-actually', title: 'How confident are you actually?', category: 'how'},
            {id: 'sensitive', title: 'How sensitive are you?', category: 'how'},
            {id: 'hidden-superpower', title: 'What\'s your hidden superpower?', category: 'hidden'},
            {id: 'secret-trauma', title: 'What\'s your secret inner trauma?', category: 'hidden'},
            {id: 'hidden-talent', title: 'What\'s your hidden natural talent?', category: 'hidden'},
            {id: 'dark-side', title: 'What\'s your dark side personality?', category: 'hidden'},
            {id: 'secret-desire', title: 'What\'s your secret desire?', category: 'hidden'},
            {id: 'hidden-fear', title: 'What\'s your hidden fear?', category: 'hidden'},
            {id: 'secret-strength', title: 'What\'s your secret strength?', category: 'hidden'},
            {id: 'love-crisis', title: 'What would you do in a love crisis?', category: 'whatwould'},
            {id: 'win-lottery', title: 'What would you do if you won the lottery?', category: 'whatwould'},
            {id: 'dangerous-situation', title: 'What would you do in a dangerous situation?', category: 'whatwould'},
            {id: 'for-dream', title: 'What would you do for your dream?', category: 'whatwould'},
            {id: 'meet-idol', title: 'What would you do if you met your idol?', category: 'whatwould'},
            {id: 'breakup', title: 'What would you do in a breakup?', category: 'whatwould'},
            {id: 'pick-personality', title: 'Pick one, we\'ll guess your personality.', category: 'pick'},
            {id: 'choose-type', title: 'Choose one, we\'ll reveal your real type.', category: 'pick'},
            {id: 'pick-soulmate', title: 'Pick your favorite, find your soulmate.', category: 'pick'},
            {id: 'choose-dark-side', title: 'Choose one, discover your dark side.', category: 'pick'},
            {id: 'pick-picture', title: 'Pick a picture, know your future.', category: 'pick'},
            {id: 'choose-true-self', title: 'Choose an option, see your true self.', category: 'pick'},
            {id: 'future-love', title: 'What\'s your future love life like?', category: 'future'},
            {id: 'who-marry', title: 'Who will you end up marrying?', category: 'future'},
            {id: 'real-destiny', title: 'What\'s your real destiny?', category: 'future'},
            {id: 'future-hold', title: 'What does your future hold for you?', category: 'future'},
            {id: 'meet-soulmate', title: 'When will you meet your soulmate?', category: 'future'}
        ];

        // Hot tests
        const hotTests = themes.filter(t => t.is_hot);
        document.getElementById('hotSection').innerHTML = hotTests.map(t => `
            <div class="hot-card" onclick="goToQuiz('${t.id}')">
                <div class="title">${t.title}</div>
                <div class="count">1.2M tests taken</div>
            </div>
        `).join('');

        // Classic (first 8)
        const classicTests = themes.slice(0, 8);
        document.getElementById('classicSection').innerHTML = classicTests.map(t => `
            <div class="grid-card" onclick="goToQuiz('${t.id}')">
                <div class="title">${t.title}</div>
                <div class="desc">Classic quiz</div>
            </div>
        `).join('');

        // Personalized (8 random)
        const shuffled = themes.sort(() => 0.5 - Math.random()).slice(0, 8);
        document.getElementById('personalSection').innerHTML = shuffled.map(t => `
            <div class="grid-card" onclick="goToQuiz('${t.id}')">
                <div class="title">${t.title}</div>
                <div class="desc">Recommended for you</div>
            </div>
        `).join('');

        // All
        document.getElementById('allSection').innerHTML = themes.map(t => `
            <div class="all-item" onclick="goToQuiz('${t.id}')">
                <div class="title">${t.title}</div>
                <div class="arrow">→</div>
            </div>
        `).join('');

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            if (!q) {
                document.querySelector('.all-list').innerHTML = themes.map(t => `
                    <div class="all-item" onclick="goToQuiz('${t.id}')">
                        <div class="title">${t.title}</div>
                        <div class="arrow">→</div>
                    </div>
                `).join('');
                return;
            }
            const filtered = themes.filter(t => t.title.toLowerCase().includes(q));
            document.querySelector('.all-list').innerHTML = filtered.map(t => `
                <div class="all-item" onclick="goToQuiz('${t.id}')">
                    <div class="title">${t.title}</div>
                    <div class="arrow">→</div>
                </div>
            `).join('');
        });

        function goToQuiz(id) {
            window.location.href = 'quiz.html?id=' + id;
        }
    </script>
</body>
</html>
